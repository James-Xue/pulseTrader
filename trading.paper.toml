# ── Gold trader: USD dynamic stop ladder (strategy 1, 2026-11-13) ────────
# Supervises EVERY open XAUUSD CFD position — including positions opened
# manually in the Gate app and imported by sync_positions. It never opens a
# position; it only manages the exit:
#   1. loss reaches -8 USD              -> stop out (hard stop)
#   2. peak floating profit > +2 USD    -> stop moves to break-even (entry)
#   3. 1m SuperTrend line participates  -> stop placed 1 USD beyond the line
#   4. peak floating profit is sampled every second; the level
#      peak - 5 USD participates, and trading through it closes at market
#   5. stops only tighten, never loosen (a manually tightened exchange stop
#      is adopted, never widened)
# The thresholds are ACCOUNT USD. 0.01 lot XAUUSD = 1 ounce, so 1 USD of PnL
# equals a 1.00 price move; larger lots divide the same USD by their ounces.
# Every tightened stop is mirrored to the exchange-native price_sl, so the
# position keeps a protective stop if the engine process dies.
[gold_trader]
enabled                = false     # 2026-11-18: operator asked for NO automatic exits
symbol                 = "XAUUSD"
market_type            = "cfd"
hard_stop_usd          = 8.0
breakeven_trigger_usd  = 2.0
supertrend_buffer_usd  = 1.0
peak_drawdown_usd      = 5.0
peak_trail_arm_usd     = 2.0       # give-back arms after +2U peak (0 = any profit)
supertrend_period      = 10.0
supertrend_multiplier  = 3.0
contract_volume        = 100.0      # XAUUSD: 100 oz per lot (sanity guard)
poll_interval_ms       = 1000
retry_cooldown_sec     = 10
exchange_stop          = true

# ── Risk Management (conservative params — adjust for account size) ────
[risk]
# The position-notional cap is enforced PER MARKET TYPE: each market has its
# own budget (override fields below), falling back to maxPositionNotional.
# This lets the synced SKHY futures short (~5099 USDT notional) coexist with
# a CFD gold position — the futures position does NOT consume the CFD budget.
maxPositionNotional = 6000        # fallback cap (markets without an override)
# futures cap: SNDK 网格峰值 (~5099) + ETH 网格峰值 (~805 @2011, 20 格×2 张)
# + 预留。08-19 教训:6000 被 ETH 网格名义击穿(9103),循环冻结+4 格裸奔
# (复盘 eth-review-20260821-grid-v1.md)。reduce-only 买单也按新增名义计不抵扣。
maxPositionNotionalFutures = 12000
maxPositionNotionalCfd = 6000     # CFD cap: 0.01-lot XAUUSD (~4392 USDT) fits
maxOpenPositions    = 80  # SNDK 20-slot + ETH 20-slot grids (each resting order
                          # reserves a slot) + user App orders + positions (08-19)
maxDailyDrawdown    = 0.02
maxDrawdown         = 0.05
# Engine-side protective exits (percentage stop-loss / take-profit supervisor).
# false = the engine NEVER closes a position on its own; exits belong to the
# strategy or the operator. The drawdown breaker still blocks new entries.
# Set 2026-11-18 so hand-managed XAUUSD longs survive normal pullbacks.
protective_exit_enabled = false
maxOrdersPerSec     = 5
# 单币种名义上限:ETH 网格峰值(~805)+ SNDK(~5099)任意其一 + 用户仓余量。
# 08-19 教训:5500 按 SNDK 单币种算,ETH 网格加入后击穿。
maxSymbolNotional   = 6500
max_leverage        = 500.0        # CFD ladder: 20/50/100/200/500 (futures use 10)
max_margin_used     = 0.5
minAvailableAfterStopUsd = 6.0   # M22: CFD 带 SL 开仓后可用-保证金-止损 ≥ 6 USD,防薄账户一笔止损耗尽交易能力

# Exchange-native catastrophe stop for FUTURES positions (audit B1). PT places
# a whole-position reduce-only trigger at this distance from entry and keeps it
# refreshed as positions appear. External (GT) futures opens are rejected
# unless this is enabled: the caller owns its software exit, so this trigger is
# the only floor left if the GT process dies. 5% from entry is deliberately
# wider than a 1h strategy stop so it never competes with the caller's exit.
exchange_stop_enabled = true
exchange_stop_pct     = 0.05

[risk.stop_loss]
mode            = "Trailing"
trailing_pct    = 0.005
fixed_pct       = 0.01
max_hold_seconds = 300

[risk.take_profit]
enabled     = true
targets_pct = [0.005, 0.01, 0.02]
fractions   = [0.33, 0.33, 0.34]

# ── AI (disabled, not needed for initial testing) ─────────────────────
[ai]
# AI 定期调参闭环(引擎内):策略引擎 + LLM 每 5 分钟评估市场与策略表现,
# 经 ParamAdvisor 安全边界(±max_delta + hard 区间)微调全部策略参数。
# apiKey 走 from_env:.env 中填 AI_API_KEY 即自动通电;无 key 时 AI 保持
# 离线(安全禁用,不影响交易)。
backend              = "claude"              # "claude" | "openai";可配 baseUrl 指向 new-api 兼容网关
model                = "claude-sonnet-4-6"   # 或网关支持的上游模型名
apiKey               = "from_env:AI_API_KEY" # 留空 = 不启动 AI 心跳
heartbeatIntervalSec = 300                   # AI 调参节奏(秒):300 = 每 5 分钟一次
stats_lookback_hours = 24                    # AI prompt 中每策略表现统计窗口(小时)
requestTimeoutMs     = 30000
maxRetries           = 2

# ── Control (JSON-RPC control socket) ─────────────────────────────────
[control]
enabled     = true
bindAddress = "127.0.0.1"
port        = 8082
# Human-readable timestamps in control-plane output (*_str fields / REPL).
# "local" (machine TZ) | "utc" | fixed offset like "-04:00" (US Eastern
# summer) or "+08:00" (Beijing) — align with the phone app's timezone.
display_timezone = "local"
# External strategy runtime (GT) order authority. Fail-safe default is false:
# caller-authoritative opens are rejected while off. Reduce-only futures
# closes and engine-sized orders are always allowed. Toggle at runtime with
# the set_external_orders control method.
external_orders_enabled = true

# ── SQLite ────────────────────────────────────────────────────────────
[sqlite]
enabled = true
dbPath  = "data/trades-paper.db"
record_market = true   # M18: persist ticker/kline to data/trades.db
record_signals = true  # M32: A/B 权重实验 — 每条策略信号 + 聚合共识落 signals 表(重放源)
skip_kline_markets = ["futures"]   # M30: 不再录制合约 kline_bars(Gate REST 实时可拉);ticker_ticks 不受影响
daily_kline_sync = false   # M31: 每日拉近 10000 根 1m k线合并入库(REST 深度上限 6.9 天)
daily_sync_hour = 8       # 北京时刻;UTC 00:00 == 北京 08:00(与网格日界一致)

# ── 资金费率窗口监视器(funding_watch,2026-09-06)───────────────────────
# 纯观察服务:费率连续高企(阈值/持续见下)时信号板亮灯 + 日志 WARN,
# 永不下单不接聚合器。规则文本 docs/funding-watch.md。
# 默认关闭 —— 开启需引擎含本模块(待 VPS 部署新二进制)。
[funding_watch]
enabled = false
symbols = ["BTC_USDT", "ETH_USDT"]
threshold = 0.0005   # 5bp/8h
consec_events = 6    # ≈48h 持续
poll_sec = 1800      # 30 分钟轮询

# ---------------------------------------------------------------------------
# [execution] — 为外部策略运行时(GT)预先接通市场
# 即使没有启用的策略实例,也创建该市场的 feed/executor/tracker,
# 供 GT 通过控制面 subscribe_market 取行情、open_order 下单。
# ---------------------------------------------------------------------------
[execution]
markets = ["futures"]
symbols = ["BTC_USDT"]

# ── Paper trading (simulated venue) ───────────────────────────────────
[paper]
enabled                  = true
account_id               = "paper-default"
# Each wallet leg (spot / futures / cfd) is seeded independently, mirroring
# Gate's separate wallets.
initial_balance_usdt     = 10000.0
state_file               = "data/paper-state.json"
lock_file                = "data/engine.paper.lock"
# Gate fee model: futures maker 0.02% / taker 0.05%, spot 0.1% per leg,
# TradFi CFD 6 USDT per 100 oz lot charged on the BUY leg only.
maker_fee_rate           = 0.0002
taker_fee_rate           = 0.0005
spot_fee_rate            = 0.001
cfd_commission_usdt_per_lot = 6.0
# Overnight swap is NOT modelled yet (0.0 overstates multi-day PnL).
cfd_swap_usdt_per_lot_per_day = 0.0
# Execution realism: fill at the touch, all-or-nothing.
slippage_bps             = 0.0
fill_ratio               = 1.0
# A mark older than this refuses new orders and matches (weekend gate).
max_mark_age_ms          = 5000
maintenance_rate         = 0.005
cfd_stop_out_level       = 0.5
stop_out_enabled         = true
snapshot_interval_ms     = 1000
# Contract sizes/tick cannot be fetched without credentials (the TradFi
# detail endpoint is authenticated), so they are configured here.
[paper.contract_volume]
XAUUSD = 100.0
XAGUSD = 5000.0
[paper.price_tick]
XAUUSD = 0.01
XAGUSD = 0.001
