# ── IronTrader 铁律交易员 (2026-09-06, v1.5 重大消息事件闸) ────────────────
# 低频纪律型趋势跟随(BTC 1m),规则 docs/strategies/iron-trader.md。
# ⚠️ enabled=false = 档案/回测载体,引擎不建实例;回测播种:
#   ./run.sh backtest --strategy iron_trader --symbol BTC_USDT --config trading.toml
#   (seedFromConfig 按 name+symbol 匹配,事件窗自动注入;--news CLI 显式值胜出)
# news_windows = 重大消息事件闸(§4.6):禁开 [T−X, T+Y),持仓跨 T−X 强制
# Flat(news_blackout)。时刻 = 官方宏观日历 2026-09→11(最近两个月):
#   FOMC 决议 = 美联储日程(9/16、10/28 为 18:00Z;11-01 起美东冬令时后移);
#   CPI/NFP = BLS 8:30 ET(夏 12:30Z / 冬 13:30Z)。窗口建议:CPI/NFP 15/30;
#   FOMC 含 SEP(9 月)15/45,常规 15/30。过期事件自失效,滚动维护。
[[strategy.instances]]
name            = "iron_trader"
symbol          = "BTC_USDT"
market_type     = "futures"
leverage        = 5
margin_mode     = "cross"
order_quantity  = 1
min_confidence  = 0.6
enabled         = false
poll_interval_ms = 500
news_windows = [
    { time = "2026-09-11T12:30:00Z", close_before_min = 15, resume_after_min = 30 },  # CPI(8月)
    { time = "2026-09-16T18:00:00Z", close_before_min = 15, resume_after_min = 45 },  # FOMC 决议+SEP
    { time = "2026-10-02T12:30:00Z", close_before_min = 15, resume_after_min = 30 },  # NFP(9月)
    { time = "2026-10-14T12:30:00Z", close_before_min = 15, resume_after_min = 30 },  # CPI(9月)
    { time = "2026-10-28T18:00:00Z", close_before_min = 15, resume_after_min = 30 },  # FOMC 决议
    { time = "2026-11-06T13:30:00Z", close_before_min = 15, resume_after_min = 30 },  # NFP(10月,冬令时)
]

