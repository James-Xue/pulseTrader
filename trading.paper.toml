# trading.paper.toml — paper-trading profile (simulated venue, no real orders)
#
# Usage:
#   ./run.sh paper                 (starts the engine)
#   ./run.sh paper-cli             (REPL against port 8082)
#   ./run.sh paper-mcp             (stdio MCP bridge against port 8082)
#
# Hard rules enforced by config validation:
#   * exchange.apiKey / apiSecret MUST be empty — paper holds no credentials
#   * [paper] lock / port / database / log dir / grid state must differ from
#     the live engine's, so both may run side by side
#   * unknown keys inside [paper] are a hard error (a typo must not silently
#     start the live path)
#
# Market data is REAL (public L1/L3 feeds); only execution is simulated.

symbols = ["BTC_USDT", "XAUUSD", "SNDK_USDT", "UNITREE_USDT", "ETH_USDT", "XAGUSD", "ZEC_USDT"]

# XAU_USDT (USDT-margined gold perpetual) 2026-11-19: live-trading pilot.
# Streamed through the ACTIVE-market watchlist only — it creates no strategy
# instance, so manual open_order can price/size it while the CFD side keeps
# its own feed. Futures-only name: never add it to the CFD subscription.
watch_symbols = ["XAU_USDT"]

# ── Active trading direction ──────────────────────────────────────────
# Only ONE direction trades at a time. The other direction's strategies are
# paused and its open orders cancelled when switching via the control plane
# (REPL `switch <futures|cfd>`, MCP switch_direction). Restart returns here.
active_market = "cfd"   # paper profile: 2026-11-19: XAU_USDT live pilot — futures is the active direction (CFD strategies paused, CFD feed still streams)

# ── Exchange (mainnet mode) ────────────────────────────────────────────
[exchange]
testnet             = false
apiKey              = ""   # paper mode: credentials are forbidden
apiSecret           = ""   # paper mode: credentials are forbidden
# URLs are auto-set by code when testnet=false, no need to specify manually
proxyUrl            = "http://127.0.0.1:7897"
restTimeoutMs       = 10000
maxRetries          = 3

# ── Logging ───────────────────────────────────────────────────────────
[log]
level     = "info"
logDir    = "logs/paper"
toConsole = true
toFile    = true

# ── Strategy (futures + spot on mainnet) ────────────────────────────────
[strategy]
signal_aggregator_threshold = 0.6
signal_cooldown_sec         = 30
# Signal-only default (2026-08-23): seeds EVERY strategy's runtime
# auto_trade switch to OFF at startup — strategies publish signals to the
# signal board (get_signals) but never place orders. Runtime one-click
# override per strategy: set_strategy_trading / `autotrade <id> on|off`
# (a restart resets to this default). Manual open_order/close_position
# (REPL/CLI/MCP — the sub-agent's path) are unaffected.
signal_only = true

[[strategy.instances]]
name            = "momentum_scalper"
symbol          = "BTC_USDT"
market_type     = "futures"
leverage        = 10
margin_mode     = "cross"
order_quantity  = 1                # Contract size (1 contract = 0.0001 BTC)
min_confidence  = 0.6
enabled         = true
poll_interval_ms = 500

[[strategy.instances]]
name            = "orderbook_scalper"
symbol          = "BTC_USDT"
market_type     = "futures"
leverage        = 10
margin_mode     = "cross"
order_quantity  = 1
min_confidence  = 0.6
enabled         = true
poll_interval_ms = 500

[[strategy.instances]]
