[project]
name = "xau-cfd"
version = "0.1.0"
description = "XAU/USD CFD volume-profile reversion bot on Gate.io TradFi"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Richard" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "structlog>=24.1",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
xau-daemon   = "xau.apps.daemon:main"
xau-replay   = "xau.apps.replay:main"
xau-inspect  = "xau.apps.inspect_profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xau", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/xau", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]